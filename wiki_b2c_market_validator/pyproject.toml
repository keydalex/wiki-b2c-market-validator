[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wiki-b2c-market-validator"
version = "1.0.0"
description = "Autonomous Agent Skill for B2C market demand validation, cross-lingual audience interest, and topic trends using Wikipedia pageviews analytics"
readme = "README.md"
authors = [{ name = "AI Engineering" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pandas>=2.2.0",
    "matplotlib>=3.8.0",
    "reportlab>=4.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
wiki-validate = "wiki_market_validator.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
